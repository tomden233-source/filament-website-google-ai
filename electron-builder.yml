appId: de.filamenthub.desktop
productName: FilamentHub
asar: false
npmRebuild: false
directories:
  output: release
files:
  - electron/**
  - server-dist/**
  - dist/**
  - public/pwa-512x512.png
  - public/icon.ico
  - package.json
  - "!**/node_modules/**"
win:
  target: nsis
  icon: public/icon.ico
nsis:
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  oneClick: true
  perMachine: false
  artifactName: FilamentHub-Setup.exe
  shortcutName: FilamentHub
publish:
  provider: generic
  url: https://github.com/tomden234/filament-website-google-ai/releases/download/desktop-latest/
