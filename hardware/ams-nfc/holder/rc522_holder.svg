<line x1="104.0" y1="616.0" x2="456.0" y2="616.0" class="d"/><text x="262" y="634.0" class="t">44</text>
<line x1="74.0" y1="74.0" x2="74.0" y2="586.0" class="d"/><text x="42.0" y="330" class="t">64</text>
