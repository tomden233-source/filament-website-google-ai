name: Build Android APK

# Baut aus der Web-App eine echte, installierbare Android-APK (Capacitor)
# und veröffentlicht sie als Release "apk-latest". Der QR-Code in der App zeigt auf diesen Download.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Web-App bauen (App-Modus, Wurzel-Pfad)
        run: npm run build
        env:
          VITE_BASE: /
          VITE_STATIC: 'true'
          VITE_NATIVE: 'true'

      - name: Live-Update-Paket (Oberfläche ohne neue APK)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          (cd dist && zip -qr ../live-bundle.zip .)
          # nativeApi muss zu NATIVE_API in android-native/FilamentLivePlugin.java passen
          echo "{\"version\":\"$VERSION\",\"nativeApi\":3}" > live-version.json
          cat live-version.json

      - name: Capacitor installieren (nur im Build, nicht im Projekt)
        run: |
          # Bis zu 3 Versuche (npm-Netz kann kurz ausfallen); bei Fehler die letzten Log-Zeilen als Annotation ausgeben
          for i in 1 2 3; do
            npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 && exit 0
            echo "Versuch $i fehlgeschlagen"
            sleep 15
          done
          tail -n 25 ~/.npm/_logs/*.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 1

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android
          # Eigenes Mini-Plugin: Web-App färbt Status- und Navigationsleiste passend zum Theme
          JAVA_DIR=android/app/src/main/java/com/filamenthub/app
          cp android-native/*.java "$JAVA_DIR/"
          # Paho MQTT (Drucker ohne Server) und NFC-Berechtigung
          sed -i '/^dependencies {/a\    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"' android/app/build.gradle
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Meldungen (Android 13+ braucht diese Berechtigung, sonst ist der Schalter in den Einstellungen grau/aus)
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\    <uses-permission android:name="android.permission.NFC" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-feature android:name="android.hardware.nfc" android:required="false" />' "$MANIFEST"
          # Bluetooth für den Etiketten-Drucker (Android 12+: Scan/Connect, älter: Standort für die Suche)
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />' "$MANIFEST"
          grep -n "BLUETOOTH_SCAN" "$MANIFEST" || echo "Hinweis: Bluetooth-Eintrag fehlt"
          # Dateifreigabe für den Installer (Cache-Ordner mit der geladenen APK)
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n    <external-path name="my_images" path="." />\n    <cache-path name="my_cache_images" path="." />\n    <files-path name="my_files" path="." />\n</paths>\n' > android/app/src/main/res/xml/file_paths.xml
          grep -n "fileprovider" "$MANIFEST" || echo "Hinweis: FileProvider fehlt im Manifest"
          grep -n "NFC\|INSTALL_PACKAGES" "$MANIFEST" || echo "Hinweis: NFC-Eintrag fehlt"
          # NFC-Tags der App öffnen die App direkt (statt Androids „Neuer Tag erkannt“-Fenster), auch wenn sie nicht vorne ist
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:xliff="urn:oasis:names:tc:xliff:document:1.2">\n    <tech-list><tech>android.nfc.tech.Ndef</tech></tech-list>\n    <tech-list><tech>android.nfc.tech.NdefFormatable</tech></tech-list>\n    <tech-list><tech>android.nfc.tech.NfcA</tech><tech>android.nfc.tech.MifareUltralight</tech></tech-list>\n</resources>\n' > android/app/src/main/res/xml/nfc_tech_filter.xml
          python3 - <<'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          xml = open(path, encoding="utf-8").read()
          filters = (
              '        <intent-filter><action android:name="android.nfc.action.NDEF_DISCOVERED" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="application/opentag3d" /></intent-filter>\n'
              '        <intent-filter><action android:name="android.nfc.action.NDEF_DISCOVERED" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="text/plain" /></intent-filter>\n'
              '        <intent-filter><action android:name="android.nfc.action.TECH_DISCOVERED" /><category android:name="android.intent.category.DEFAULT" /></intent-filter>\n'
              '        <meta-data android:name="android.nfc.action.TECH_DISCOVERED" android:resource="@xml/nfc_tech_filter" />\n'
          )
          if "NDEF_DISCOVERED" in xml:
              print("NFC-Filter schon vorhanden")
          else:
              i = xml.find("</activity>")
              if i < 0:
                  print("Hinweis: Activity im Manifest nicht gefunden, NFC-Filter fehlen")
              else:
                  xml = xml[:i] + filters + "    " + xml[i:]
                  open(path, "w", encoding="utf-8").write(xml)
                  print("NFC-Filter eingetragen")
          PYEOF
          grep -n "NDEF_DISCOVERED\|TECH_DISCOVERED" "$MANIFEST" || echo "Hinweis: NFC-Filter fehlen"
          grep -n "paho" android/app/build.gradle || echo "Hinweis: Paho fehlt"
          # Inhalt nicht unter die Systemleisten zeichnen (Menü oben links bleibt sichtbar), Leistenfarben sind einstellbar
          for st in AppTheme AppTheme.NoActionBar AppTheme.NoActionBarLaunch; do
            sed -i "/<style name=\"$st\"/a\        <item name=\"android:windowOptOutEdgeToEdgeEnforcement\">true</item>" android/app/src/main/res/values/styles.xml || echo "Hinweis: Theme nicht gefunden, Systemleisten bleiben Standard"
          done
          grep -n "windowOptOutEdgeToEdgeEnforcement" android/app/src/main/res/values/styles.xml || echo "Hinweis: Theme nicht gefunden, Systemleisten bleiben Standard"
          # Eigenes App-Icon statt Standard-Icon
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/pwa-512x512.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp public/pwa-512x512.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp public/pwa-512x512.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Signierte Release-APK bauen
        working-directory: android
        env:
          KS_FILE: ${{ github.workspace }}/android-signing/filamenthub.keystore
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'filamenthub' }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS_FILE" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias=filamenthub \
            -Pandroid.injected.signing.key.password="$KS_PASS"
          cp app/build/outputs/apk/release/app-release.apk ../FilamentHub.apk

      - name: APK als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: FilamentHub-apk
          path: FilamentHub.apk

      - name: Release "apk-latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest FilamentHub.apk live-bundle.zip live-version.json \
            --title "FilamentHub APK v$VERSION" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. Auf dem Handy installieren (Unbekannte Quellen erlauben)." \
            --latest
