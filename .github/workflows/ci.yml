name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typprüfung: seit v1.73 fehlerfrei, darum jetzt blockierend (neue Fehler fallen sofort auf)
      - name: Typprüfung
        run: npm run lint
      - name: Build
        run: npm run build
